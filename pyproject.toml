[project]
name = "parley"
version = "0.1.0"
description = "LLM factions and diplomacy for Medieval II: Total War"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.8", "httpx>=0.27", "discord.py>=2.4"]

[dependency-groups]
dev = ["pytest>=8", "lupa>=2.2"]  # lupa: LuaJIT in-process, to test the game-side Lua

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parley"]

[tool.pytest.ini_options]
testpaths = ["tests"]
