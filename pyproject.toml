[project]
name = "parley"
version = "0.1.0"
description = "LLM factions and diplomacy for Medieval II: Total War"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "discord.py>=2.4",
    "pillow>=13.0.0",
    "jigsaw",
]

[tool.uv.sources]
# Jigsaw, the algorithms-first decision engine, pinned to a public release tag. To ship a Jigsaw
# change here: tag a new version there, bump this tag, run `uv lock`.
jigsaw = { git = "https://github.com/williamblair333/jigsaw", tag = "v0.1.0" }

[dependency-groups]
dev = ["pytest>=8", "lupa>=2.2"]  # lupa: LuaJIT in-process, to test the game-side Lua

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parley"]

[tool.pytest.ini_options]
testpaths = ["tests"]
