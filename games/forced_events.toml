route = "no direct call in EOP (createMessageMarriageProposal has no adoption twin). 4 turns awake with offers on: nothing (11-06). Next: agy's lead, overriding onCalculationRatioForBirth from Lua (patchesForGame.cpp:3844), unverified"
interrupt = "adoption_man_of_hour"
inventory = ["C4"]
[events.man_of_the_hour]
