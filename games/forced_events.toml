# Everything the game can raise on a ruler, and how to make it happen at will so it can be tested
# without waiting on the game's dice (STANDARDS forced-events; the author 11-06: "we don't want to be at the
# mercy of the game"). tests/test_forced_events.py holds this honest:
#
#   forced    `case` (<suite>/<name>) makes it happen every time; it must exist and not be a chance case
#   route     a way is known (`route`) but no bench case proves it yet: the work list
#   no_route  tried, and it can't be forced; `why` says what was tried. Never without trying
#
# `route` calls come from the EOP source (M2TWEOP Code/M2TWEOP library/types/). A route is a claim until
# a case fires it. `interrupt` names the games/interrupts.toml event this forces, `inventory` the row(s)
# of docs/decision-inventory.md, `scrolls` the K.GAME_POPUPS names the bridge knows it by.

[events.marriage_wife_offer]
what = "a woman offered as a wife for one of the ruler's men"
status = "forced"
case = "family/forced_wife_declined_by_element"
interrupt = "marriage_offer"
inventory = ["C4"]

[events.marriage_suitor_offer]
what = "a man offered as a suitor for the ruler's princess"
status = "forced"
case = "family/forced_suitor_declined_by_element"
interrupt = "princess_suitor_offer"
inventory = ["C4"]

[events.adoption_offer]
what = "a man offered for adoption into the family"
