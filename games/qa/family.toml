name = "forced_suitor_declined_by_element"
max_turns = 2
choice = "decline"
setup = [
    'return M.qa.marriage_offers_on()',
    { lua = 'return M.qa.force_offer("england", "suitor")', bind = "offered" },
]
expect = [
    { log = 'marriage offer: [^\n]+ for england' },
    { log = 'popup: a marriage offer answered by the ruler' },
    { log = 'popup: a marriage offer: pressed decline on [^\n]+ by its element' },
    { alive = 30, after = 'popup: a marriage offer answered by the ruler' },
]

[[cases]]
name = "forced_wife_accepted_by_element"
max_turns = 2
choice = "accept"
setup = [
    'return M.qa.marriage_offers_on()',
    { lua = 'return M.qa.free_tile($garrison_town_x, $garrison_town_y, 1, 2)', bind = "at" },
    { lua = 'return M.qa.spawn_army("england", $at_x, $at_y)', bind = "groom" },
    { lua = 'return M.qa.force_offer("england", "wife")', bind = "offered" },
]
expect = [
    { log = 'marriage offer: [^\n]+ for england \(a wife\)' },
    { log = 'popup: a marriage offer answered by the ruler' },
    { log = 'popup: a marriage offer: pressed accept on [^\n]+ by its element' },
    { alive = 30, after = 'popup: a marriage offer answered by the ruler' },
    # the accept took (11-06: three runs "passed" with a blank answer that declined). The game picks the
    # groom: 11-21 the wife went to Captain Robin, not the spawned $groom, a second after the press
    { log = 'character event: england: [^\n]+ married' },
]

[[cases]]
name = "forced_suitor_accepted_by_element"
max_turns = 2
choice = "accept"
setup = [
    'return M.qa.marriage_offers_on()',
    { lua = 'return M.qa.force_offer("england", "suitor")', bind = "offered" },
]
expect = [
    { log = 'marriage offer: [^\n]+ for england' },
    { log = 'popup: a marriage offer answered by the ruler' },
    { log = 'popup: a marriage offer: pressed accept on [^\n]+ by its element' },
    { alive = 30, after = 'popup: a marriage offer answered by the ruler' },
    # the offer names him "Anthony of_Pickering", the event "Anthony of Pickering" (11-21)
    { log = 'character event: england: [^\n]+ married a princess' },
]

# A decline through the whole loop: the bridge presses decline on the scroll by its element (#645), no
# click and no Escape. A chance case: no offer in the turns is inconclusive, never a pass.
[[cases]]
name = "marriage_offer_declined_by_element"
chance = true
max_turns = 6  # 3 was too few on 11-06: the offer came one turn after the case stopped
choice = "decline"
setup = [
    'return M.qa.marriage_offers_on()',
    { lua = 'return M.qa.free_tile($garrison_town_x, $garrison_town_y, 1, 2)', bind = "at" },
    { lua = 'return M.qa.spawn_army("england", $at_x, $at_y)', bind = "groom" },
]
expect = [
    { log = 'marriage offer: [^\n]+ for england' },
    { log = 'popup: a marriage offer answered by the ruler' },
    { log = 'popup: a marriage offer: pressed decline on [^\n]+ by its element' },
    { alive = 30, after = 'popup: a marriage offer answered by the ruler' },
]
